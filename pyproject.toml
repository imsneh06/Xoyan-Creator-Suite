[project]
name = "xoyan-studio"
version = "0.4.0"
description = "Xoyan Studio: The All-in-One Private AI Suite for Creators (AI Music, Vertical Shorts & Voiceover)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xoyan", email = "contact@xoyan.org" }]
requires-python = ">=3.10"
keywords = ["xoyan", "xoyan-studio", "music", "shorts", "voiceover", "ace-step", "ai-music"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]

# Runtime deps are managed by ACE-Step itself (loaded via `uv run` from its dir).
# The skill scripts have no pip-installable runtime deps beyond Python stdlib.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "ruff>=0.4",
  "shellcheck-py>=0.10",
]
shorts = [
  "faster-whisper>=1.0.0",
  "edge-tts>=6.1.0",
  "opencv-python>=4.8.0",
  "yt-dlp>=2024.0.0",
]
# Deferred to Theme 3 (Session 3+); documented here as the contract.
ranking = [
  "librosa>=0.10",
  "laion-clap",
  "soundfile",
]

[tool.setuptools]
# Not a Python package: a Claude Code skill repo. Nothing to discover.
packages = []

[project.urls]
Homepage = "https://www.xoyan.org"
Repository = "https://github.com/imsneh06/claude-music"
Issues = "https://github.com/imsneh06/claude-music/issues"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["research/scratch", "research/drafts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",  # line too long (ruff formatter handles)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/claude-music/scripts"]
addopts = "-v --tb=short"

[tool.pyrefly]
preset = "off"
project-includes = ["."]
project-excludes = [
  "skills/**",
  "tests/**"
]
search-path = [
  ".",
  "skills/claude-music",
  "skills/claude-music/scripts",
  "skills/claude-music/webapp",
]
ignore-missing-imports = [
  "acestep",
  "acestep.*",
  "cv2",
  "cv2.*",
  "edge_tts",
  "edge_tts.*",
  "faster_whisper",
  "faster_whisper.*",
  "google",
  "google.*",
  "google.genai",
  "google.genai.*",
  "reel_autoedit",
  "shorts_engine",
  "torch",
  "torch.*",
  "vllm",
  "vllm.*",
  "yt_dlp",
  "yt_dlp.*",
]

[tool.pyrefly.errors]
missing-import = "ignore"
all = "ignore"

[tool.pyright]
include = ["skills", "tests"]
extraPaths = [
  ".",
  "skills/claude-music",
  "skills/claude-music/scripts",
  "skills/claude-music/webapp",
]
reportMissingImports = false
reportMissingModuleSource = false

